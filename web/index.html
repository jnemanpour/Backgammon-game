<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#241a11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Backgammon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ===== HOME SCREEN ===== -->
    <section id="home" class="screen active">
      <div class="home-plaque">Backgammon</div>

      <div class="home-panel">
        <div class="field">
          <span class="field-label">Difficulty</span>
          <div class="seg" id="homeLevel">
            <button type="button" data-level="easy">Easy</button>
            <button type="button" data-level="medium">Medium</button>
            <button type="button" data-level="hard">Hard</button>
            <button type="button" data-level="expert">Expert</button>
          </div>
        </div>

        <label class="field row toggle">
          <span class="field-label">Teaching mode</span>
          <input type="checkbox" id="homeTeach" />
        </label>

        <div class="field row" id="tierRow">
          <span class="field-label">Hint detail</span>
          <select id="homeTier">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <label class="field row toggle">
          <span class="field-label">Sound &amp; haptics</span>
          <input type="checkbox" id="homeSound" checked />
        </label>
      </div>

      <div class="home-actions">
        <button id="resumeBtn" class="bigbtn">Resume game</button>
        <button id="playBtn" class="bigbtn primary">New game</button>
      </div>

      <div class="home-stats" id="homeStats"></div>
    </section>

    <!-- ===== GAME SCREEN ===== -->
    <section id="game" class="screen">
      <div class="gamebar">
        <button id="homeBtn" class="iconbtn" title="Menu">☰</button>
        <span class="msg" id="msg"></span>
        <span class="pips" id="pips"></span>
        <button id="teachBtn" class="iconbtn" title="Teaching hints">💡</button>
      </div>

      <div id="board">
        <div class="board-half top">
          <div class="quadrant" id="q-tl"></div>
          <div class="bar" id="bar-top"></div>
          <div class="quadrant" id="q-tr"></div>
          <div class="tray" id="tray-top"><span class="count">0</span></div>
        </div>
        <div class="board-half bottom">
          <div class="quadrant" id="q-bl"></div>
          <div class="bar" id="bar-bottom"></div>
          <div class="quadrant" id="q-br"></div>
          <div class="tray" id="tray-bottom"><span class="count">0</span></div>
        </div>
      </div>

      <div class="diceRow">
        <div id="cube" class="cube">1</div>
        <div id="dice"></div>
      </div>

      <div class="controls">
        <button id="rollBtn" class="primary">Roll</button>
        <button id="undoBtn">Undo</button>
        <button id="doubleBtn">Double</button>
      </div>

      <div class="teachPanel" id="teachPanel" style="display:none">
        <div class="verdict"></div>
        <div class="why"></div>
      </div>
    </section>

  </div>

  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="teach.js"></script>
  <script src="ui.js"></script>
</body>
</html>
