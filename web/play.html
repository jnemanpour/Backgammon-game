<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#241a11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Backgammon</title>
  <!-- self-contained build; edit web/*.js and rerun build_play.py -->
  <style>
:root {
  /* solid material colors — no gradients */
  --felt: #b58a55;          /* playing surface (camel) */
  --felt-dark: #7c5631;     /* bear-off tray */
  --wood: #34241a;          /* walnut frame */
  --wood-light: #4a3320;    /* center bar / lighter walnut */
  --wood-edge: #1d130c;     /* frame edge */
  --pt-light: #e7d6b1;      /* cream point */
  --pt-dark: #5a3a22;       /* walnut point */
  --white-checker: #e9dfc7; /* ivory checker body */
  --white-edge: #b39c6c;
  --white-ring: #cdba8c;
  --white-text: #6a5230;
  --black-checker: #2e2014; /* espresso checker body */
  --black-edge: #150d06;
  --black-ring: #574230;
  --black-text: #d6c4a2;
  --hi-src: #1f7bd6;        /* source highlight (blue) */
  --hi-dst: #2bb24a;        /* destination highlight (green) */
  --bg: #1c140d;            /* dark backdrop */
  --panel: #2a1c11;
  --text: #f1e8d6;
  --muted: #bda988;

  /* fine felt noise */
  --tex-felt: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='90'%20height='90'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.85'%20numOctaves='2'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'%20opacity='0.045'/%3E%3C/svg%3E");
  /* directional wood grain */
  --tex-wood: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='220'%3E%3Cfilter%20id='w'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.014%200.17'%20numOctaves='3'%20seed='7'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23w)'%20opacity='0.11'/%3E%3C/svg%3E");
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100%; overflow: hidden; }
#app { max-width: 540px; margin: 0 auto; padding: 6px 8px;
  height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  background-color: var(--wood);
  background-image: var(--tex-wood); background-size: 220px 220px; }
/* fixed-height rows; the board flexes to fill what's left */
.gamebar, .controls, .teachPanel { flex: 0 0 auto; }

/* ===== screens ===== */
.screen { display: none; }
.screen.active { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; gap: 5px; }

/* ===== home screen ===== */
#home { align-items: center; justify-content: center; gap: 16px; padding: 12px; }
.home-plaque { font-size: 30px; font-weight: 800; letter-spacing: .5px; color: #f0dcab;
  text-shadow: 0 1px 0 #1d130c;
  padding: 14px 30px; border-radius: 6px;
  background: var(--wood-light); background-image: var(--tex-wood); background-size: 220px 220px;
  border: 2px solid #1d130c;
  box-shadow: inset 0 0 0 1px #6a4a2a, 0 4px 10px rgba(0,0,0,.5); }
.home-panel { width: 100%; max-width: 360px; background: var(--panel);
  border: 1px solid #4a3320; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.row { flex-direction: row; align-items: center; justify-content: space-between; }
.field-label { color: #e9d6b4; font-size: 14px; font-weight: 600; }
.seg { display: flex; gap: 4px; background: #1d130c; border-radius: 7px; padding: 4px; }
.seg button { flex: 1; padding: 9px 4px; border: none; border-radius: 5px; background: transparent;
  color: #d9c3a0; font-size: 13px; font-weight: 600; }
.seg button.on { background: var(--pt-dark); color: #fff; box-shadow: inset 0 0 0 1px #7a5230; }
#home select { background: #1d130c; color: var(--text); border: 1px solid #4a3320; border-radius: 6px; padding: 7px 10px; font-size: 14px; }
#home .toggle input { width: 20px; height: 20px; }
.home-actions { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
.bigbtn { padding: 15px; border-radius: 8px; font-size: 17px; font-weight: 700;
  border: 1px solid #1d130c; background: var(--wood-light); color: #f0e2c8;
  box-shadow: inset 0 0 0 1px #5a4129, 0 3px 8px rgba(0,0,0,.4); }
.bigbtn.primary { background: #9a6a33; border-color: #1d130c; color: #fff;
  box-shadow: inset 0 0 0 1px #b58341, 0 3px 8px rgba(0,0,0,.4); }
.bigbtn:active { transform: scale(.98); }
.home-stats { color: #d3bd98; font-size: 13px; }

/* ===== game top bar ===== */
.gamebar { display: flex; align-items: center; gap: 8px; padding: 2px 2px; }
.gamebar .msg { flex: 1; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gamebar .pips { font-size: 12px; color: var(--muted); white-space: nowrap; }
.iconbtn { width: 38px; height: 34px; flex: 0 0 auto; border-radius: 6px; border: 1px solid #1d130c;
  background: var(--wood-light); color: #f0e2c8; font-size: 17px; line-height: 1; }
.iconbtn.on { background: #9a6a33; border-color: #1d130c; }
.iconbtn:active { transform: scale(.95); }
.gamebar .cube { width: 32px; height: 32px; font-size: 14px; flex: 0 0 auto; }

.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; font-weight: 700; }
.topbar select, .topbar button, .controls button {
  background: var(--wood-light); color: var(--text); border: 1px solid #1d130c;
  border-radius: 6px; padding: 7px 10px; font-size: 14px; }
.toggle { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }

.status { background: var(--panel); border-radius: 6px; padding: 6px 10px; font-size: 13px;
  min-height: 20px; display: flex; justify-content: space-between; gap: 8px; }
.status .msg { color: var(--text); }
.status .pips { color: var(--muted); white-space: nowrap; }

/* ===== Board ===== */
#board { border: 10px solid var(--wood); border-radius: 8px; position: relative;
  margin: 2px 0; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  background-color: var(--wood); background-image: var(--tex-wood); background-size: 220px 220px;
  box-shadow: inset 0 0 0 2px var(--wood-edge), 0 6px 18px rgba(0,0,0,.55); }
.board-half { display: flex; flex: 1; min-height: 0; }
.quadrant { display: flex; flex: 12; min-width: 0;
  background-color: var(--felt);
  background-image: var(--tex-felt); background-size: 90px 90px; }
.bar { flex: 1.4; display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; min-width: 22px;
  background-color: var(--wood-light); background-image: var(--tex-wood); background-size: 220px 220px;
  box-shadow: inset 1px 0 0 var(--wood-edge), inset -1px 0 0 var(--wood-edge); }
.tray { flex: 1.6; display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; min-width: 26px;
  background-color: var(--felt-dark);
  box-shadow: inset 2px 0 0 var(--wood-edge); }

.point { flex: 1; position: relative; display: flex; flex-direction: column;
  align-items: center; min-width: 0; cursor: pointer; }
.board-half.top .point { justify-content: flex-start; }
.board-half.bottom .point { justify-content: flex-end; }
/* triangles — flat solid colors */
.point::before { content: ""; position: absolute; left: 8%; right: 8%; }
.board-half.top .point::before { top: 0; height: 92%;
  clip-path: polygon(0 0, 100% 0, 50% 100%); }
.board-half.bottom .point::before { bottom: 0; height: 92%;
  clip-path: polygon(50% 0, 0 100%, 100% 100%); }
.board-half.top .point:nth-child(odd)::before  { background: var(--pt-dark); }
.board-half.top .point:nth-child(even)::before { background: var(--pt-light); }
.board-half.bottom .point:nth-child(odd)::before  { background: var(--pt-dark); }
.board-half.bottom .point:nth-child(even)::before { background: var(--pt-light); }

.point .label { position: absolute; font-size: 9px; color: rgba(255,255,255,.5); z-index: 2; }
.board-half.top .point .label { bottom: 2px; }
.board-half.bottom .point .label { top: 2px; }

.checkers { position: relative; z-index: 3; display: flex; flex-direction: column;
  align-items: center; width: 100%; }
.board-half.bottom .checkers { flex-direction: column-reverse; }
.checker { width: 86%; max-width: 32px; aspect-ratio: 1; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
  margin: -1px 0; position: relative;
  box-shadow: 0 2px 3px rgba(0,0,0,.45); }
/* concentric turned-wood grooves (flat rings, no gradient) */
.checker::before { content: ""; position: absolute; width: 64%; height: 64%; border-radius: 50%;
  z-index: 1; }
.checker::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%;
  z-index: 1; }
.checker.w { background: var(--white-checker); border: 1.5px solid var(--white-edge); color: var(--white-text); }
.checker.w::before { border: 1.5px solid var(--white-ring); }
.checker.w::after { border: 1.5px solid var(--white-ring); }
.checker.b { background: var(--black-checker); border: 1.5px solid var(--black-edge); color: var(--black-text); }
.checker.b::before { border: 1.5px solid var(--black-ring); }
.checker.b::after { border: 1.5px solid var(--black-ring); }

/* stacked checkers in bar/tray are smaller */
.bar .checker, .tray .checker { width: 70%; max-width: 22px; }
.tray .count { color: var(--muted); font-size: 11px; padding: 2px; }

.bar, .tray { position: relative; }

/* movable checkers: the liftable (top-of-stack) checker gets a soft glowing
   ring that gently breathes — "ready to pick up" — instead of a hard box. */
.point.src .checker:last-child,
.bar.src .checker:last-child {
  box-shadow: 0 2px 3px rgba(0,0,0,.45),
              0 0 0 2px var(--hi-src),
              0 0 9px 1px rgba(43,128,221,.55);
  z-index: 6;
  animation: liftBreathe 1.5s ease-in-out infinite; }
@keyframes liftBreathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-2px) scale(1.035); } }

/* selected source: lifted off the board with a bright white halo */
.point.sel .checker:last-child,
.bar.sel .checker:last-child {
  box-shadow: 0 7px 9px rgba(0,0,0,.5),
              0 0 0 2.5px #fff,
              0 0 13px 2px rgba(255,255,255,.5);
  transform: translateY(-4px) scale(1.07);
  z-index: 7; }

/* Landing spots: the triangle itself glow-pulses. Yellow = a legal place the
   selected checker can land; green = a teaching-mode recommended spot. */
.point.dst::after, .point.bestghost::after { content: ""; position: absolute;
  left: 8%; right: 8%; z-index: 2; pointer-events: none; }
.board-half.top .point.dst::after, .board-half.top .point.bestghost::after {
  top: 0; height: 92%; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.board-half.bottom .point.dst::after, .board-half.bottom .point.bestghost::after {
  bottom: 0; height: 92%; clip-path: polygon(50% 0, 0 100%, 100% 100%); }
.point.dst::after       { background: rgba(255,212,60,.45); animation: glowYellow 1s ease-in-out infinite; }
.point.bestghost::after { background: rgba(70,222,110,.5);  animation: glowGreen  1s ease-in-out infinite; }
.tray.dst { animation: glowYellowBox 1s ease-in-out infinite; }

@keyframes glowYellow {
  0%,100% { opacity: .5; filter: drop-shadow(0 0 2px rgba(255,205,50,.7)); }
  50%     { opacity: 1;  filter: drop-shadow(0 0 10px rgba(255,205,50,1)); } }
@keyframes glowGreen {
  0%,100% { opacity: .5; filter: drop-shadow(0 0 2px rgba(55,215,100,.7)); }
  50%     { opacity: 1;  filter: drop-shadow(0 0 10px rgba(55,215,100,1)); } }
@keyframes glowYellowBox {
  0%,100% { box-shadow: inset 0 0 0 2px rgba(255,205,50,.5), 0 0 4px rgba(255,205,50,.4); }
  50%     { box-shadow: inset 0 0 0 3px rgba(255,205,50,1), 0 0 12px rgba(255,205,50,.9); } }

/* a checker mid-flight between points */
.checker.flying { position: fixed; z-index: 100; pointer-events: none; margin: 0;
  transition: transform .26s cubic-bezier(.22,.7,.3,1); will-change: transform; }
/* the just-arrived checker settling onto its point */
.checker.land { animation: landPop .2s cubic-bezier(.34,1.56,.64,1); }
@keyframes landPop { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }

/* Dice + cube */
#dice.dice-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 10px; z-index: 30; pointer-events: none; }
.dice-overlay .die { box-shadow: 0 4px 8px rgba(0,0,0,.5); }
.die { width: 42px; height: 42px; background: #f4f0e6; border-radius: 6px; display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; box-shadow: 0 2px 4px rgba(0,0,0,.4);
  border: 1px solid #d8d0bd;
  transition: opacity .2s, transform .2s; }
.die.used { opacity: .35; transform: scale(.9); }
/* dark dice for the AI player's turn */
.die.brown { background: #2e2014; border-color: #150d06; }
.die.brown .pip { background: #efe2c7; }
#dice.rolling .die { animation: tumble .14s linear infinite; }
@keyframes tumble {
  0% { transform: rotate(0) scale(1); } 25% { transform: rotate(-12deg) scale(1.08); }
  50% { transform: rotate(0) scale(1.12); } 75% { transform: rotate(12deg) scale(1.08); }
  100% { transform: rotate(0) scale(1); } }
.die.settle { animation: settleDie .26s cubic-bezier(.34,1.56,.64,1); }
@keyframes settleDie { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.die .pip { width: 7px; height: 7px; border-radius: 50%; background: #1a1a1a; align-self: center; justify-self: center; }
.cube { width: 40px; height: 40px; border: 1px solid #1d130c; border-radius: 6px; background: #e9dfc7;
  color: #2e2014; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
  box-shadow: inset 0 0 0 1px #cdba8c; }
.cube small { font-size: 9px; color: var(--muted); position: absolute; margin-top: 28px; }

/* floating contextual control (bottom-center): Roll, then Undo once rolled */
.dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; z-index: 40; }
.dockbtn { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%;
  border: 1px solid #1d130c; background: var(--wood-light); color: #f0e2c8;
  font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 0 0 1px #5a4129; cursor: pointer;
  transition: transform .08s, opacity .18s; }
.dockbtn .ic { display: block; transform: translateY(-.5px); }
.dockbtn.primary { width: 50px; height: 50px; font-size: 22px; color: #fff;
  background: #9a6a33; border-color: #1d130c;
  box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 0 1px #b58341; }
.dockbtn.primary:not(:disabled) { animation: rollPulse 1.6s ease-in-out infinite; }
@keyframes rollPulse {
  0%,100% { box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 0 1px #b58341, 0 0 0 0 rgba(190,140,70,.5); }
  50%     { box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 0 1px #b58341, 0 0 0 8px rgba(190,140,70,0); } }
.dockbtn:disabled { opacity: .35; animation: none; cursor: default; }
.dockbtn:active:not(:disabled) { transform: scale(.91); }

/* the doubling cube (top bar) lights up when you may double */
.gamebar .cube.can { cursor: pointer; border-color: #b58341;
  animation: cubePulse 1.9s ease-in-out infinite; }
@keyframes cubePulse {
  0%,100% { box-shadow: inset 0 0 0 1px #cdba8c, 0 0 0 0 rgba(190,140,70,.5); }
  50%     { box-shadow: inset 0 0 0 1px #cdba8c, 0 0 0 5px rgba(190,140,70,0); } }

/* teaching review — a dismissible popup card at the top of the board */
.teachPanel { position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  width: calc(100% - 20px); max-width: 470px; z-index: 45;
  background: var(--panel); border: 1px solid #5a4129; border-radius: 10px;
  padding: 11px 36px 12px 14px; font-size: 13px; line-height: 1.4;
  box-shadow: 0 12px 30px rgba(0,0,0,.6); }
.teach-close { position: absolute; top: 6px; right: 8px; width: 26px; height: 26px;
  border: none; background: transparent; color: var(--muted); font-size: 21px;
  line-height: 1; cursor: pointer; border-radius: 6px; }
.teach-close:hover { color: var(--text); }
.teachPanel .verdict { font-weight: 700; margin-bottom: 4px; }
.teachPanel .verdict.best { color: #7CFC9A; }
.teachPanel .verdict.good { color: #a3e635; }
.teachPanel .verdict.doubtful { color: #fbbf24; }
.teachPanel .verdict.error { color: #fb923c; }
.teachPanel .verdict.blunder { color: #f87171; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
  align-items: center; justify-content: center; z-index: 50; }
.modal .card { background: var(--panel); border-radius: 8px; padding: 18px; max-width: 320px; text-align: center;
  border: 1px solid #4a3320; }
.modal .card h2 { margin: 0 0 8px; }
.modal .card .row { display: flex; gap: 8px; margin-top: 12px; }
.modal .card .row button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: 700; }
.stats { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }


</style>
</head>
<body>
  <div id="app">

    <!-- ===== HOME SCREEN ===== -->
    <section id="home" class="screen active">
      <div class="home-plaque">Backgammon</div>

      <div class="home-panel">
        <div class="field">
          <span class="field-label">Difficulty</span>
          <div class="seg" id="homeLevel">
            <button type="button" data-level="easy">Easy</button>
            <button type="button" data-level="medium">Medium</button>
            <button type="button" data-level="hard">Hard</button>
            <button type="button" data-level="expert">Expert</button>
          </div>
        </div>

        <label class="field row toggle">
          <span class="field-label">Teaching mode</span>
          <input type="checkbox" id="homeTeach" />
        </label>

        <div class="field row" id="tierRow">
          <span class="field-label">Hint detail</span>
          <select id="homeTier">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <label class="field row toggle">
          <span class="field-label">Sound &amp; haptics</span>
          <input type="checkbox" id="homeSound" checked />
        </label>
      </div>

      <div class="home-actions">
        <button id="resumeBtn" class="bigbtn">Resume game</button>
        <button id="playBtn" class="bigbtn primary">New game</button>
      </div>

      <div class="home-stats" id="homeStats"></div>
    </section>

    <!-- ===== GAME SCREEN ===== -->
    <section id="game" class="screen">
      <div class="gamebar">
        <button id="homeBtn" class="iconbtn" title="Menu">☰</button>
        <span class="msg" id="msg"></span>
        <span class="pips" id="pips"></span>
        <div id="cube" class="cube" title="Doubling cube — tap to double">1</div>
        <button id="teachBtn" class="iconbtn" title="Teaching hints">💡</button>
      </div>

      <div id="board">
        <div class="board-half top">
          <div class="quadrant" id="q-tl"></div>
          <div class="bar" id="bar-top"></div>
          <div class="quadrant" id="q-tr"></div>
          <div class="tray" id="tray-top"><span class="count">0</span></div>
        </div>
        <div class="board-half bottom">
          <div class="quadrant" id="q-bl"></div>
          <div class="bar" id="bar-bottom"></div>
          <div class="quadrant" id="q-br"></div>
          <div class="tray" id="tray-bottom"><span class="count">0</span></div>
        </div>
        <div id="dice" class="dice-overlay"></div>

        <div class="dock">
          <button id="rollBtn" class="dockbtn primary" title="Roll dice" aria-label="Roll dice"><span class="ic">⚅</span></button>
          <button id="undoBtn" class="dockbtn" title="Undo move" aria-label="Undo move" style="display:none"><span class="ic">↺</span></button>
        </div>

        <div class="teachPanel" id="teachPanel" style="display:none">
          <button class="teach-close" id="teachClose" title="Dismiss" aria-label="Dismiss">×</button>
          <div class="verdict"></div>
          <div class="why"></div>
        </div>
      </div>
    </section>

  </div>

  <script>
// engine.js — backgammon rules engine (browser + Node).
// A faithful port of Sources/BackgammonEngine (validated by dev/oracle).
//
// Conventions: points[1..24] from White's view, index 0 unused.
//   +n = n White checkers, -n = n Black checkers. White (= +1) moves high->low
//   and bears off past 1; Black (= -1) mirrors. All generation runs on a
//   normalized board (mover positive) and is de-normalized on the way out.
(function (root, factory) {
  const mod = factory();
  if (typeof module === "object" && module.exports) module.exports = mod;
  else root.Engine = mod;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const WHITE = 1, BLACK = -1;

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = gain || 0.05;
    src.connect(g); g.connect(a.destination); src.start();
  }
  const sfx = {
    dice() { noise(0.18, 0.06); },
    move() { tone(330, 0.08, "triangle", 0.05); },
    hit() { tone(150, 0.16, "sawtooth", 0.07); },
    win() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.25, "sine", 0.08), i * 110)); },
    lose() { tone(196, 0.4, "sine", 0.06); },
  };

  // ---------- persistence ----------
  const KEY = "bg_save_v1";
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({
      board: S.board, player: S.player, phase: S.phase, level: S.level,
      teach: S.teach, tier: S.tier, cube: S.cube, cubeOwner: S.cubeOwner, stats: S.stats,
      sound: S.sound,
    })); } catch (e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!d) return false;
      Object.assign(S, { board: d.board, player: d.player, level: d.level || "medium",
        teach: !!d.teach, tier: d.tier || "intermediate", cube: d.cube || 1,
        cubeOwner: d.cubeOwner ?? null, stats: d.stats || S.stats, sound: d.sound !== false });
      // Always resume at a clean roll decision for whoever was on move.
      S.phase = E.winner(S.board) ? "over" : "roll";
      return true;
    } catch (e) { return false; }
  }

  // ---------- board DOM ----------
  function buildBoard() {
    for (const qid in QUADS) {
      const q = $(qid); q.innerHTML = "";
      for (const p of QUADS[qid]) {
        const pt = document.createElement("div");
        pt.className = "point"; pt.dataset.point = p;
        pt.innerHTML = `<span class="label">${p}</span><div class="checkers"></div>`;
        pt.addEventListener("click", () => onPointTap(p));
        q.appendChild(pt);
      }
    }
    $("bar-bottom").addEventListener("click", () => onPointTap(25)); // white enters from bar
    $("tray-bottom").addEventListener("click", () => onPointTap(0)); // white bears off
  }

  function checkerEl(side, label) {
    const c = document.createElement("div");
    c.className = "checker " + side;
    if (label) c.textContent = label;
    return c;
  }
  function renderStack(container, n, side) {
    container.innerHTML = "";
    const shown = Math.min(n, 5);
    for (let i = 0; i < shown; i++) {
      const top = i === shown - 1 && n > 5;
      container.appendChild(checkerEl(side, top ? String(n) : ""));
    }
  }

  function render() {
    const b = S.board;
    // points
    for (let p = 1; p <= 24; p++) {
      const el = document.querySelector(`.point[data-point="${p}"]`);
      const checkers = el.querySelector(".checkers");
      const w = E.count(b, p, WHITE), bl = E.count(b, p, BLACK);
      renderStack(checkers, w || bl, w ? "w" : "b");
      el.classList.remove("src", "dst", "sel", "bestghost");
    }
    // bar
    renderStack($("bar-bottom").querySelector(".checkers") || mkBarCheckers("bar-bottom"), b.barW, "w");
    renderStack($("bar-top").querySelector(".checkers") || mkBarCheckers("bar-top"), b.barB, "b");
    $("bar-bottom").classList.remove("src");
    // trays
    $("tray-bottom").querySelector(".count").textContent = "✓ " + b.offW;
    $("tray-top").querySelector(".count").textContent = "✓ " + b.offB;
    $("tray-bottom").classList.remove("dst");

    // highlights for current human move (suppressed mid-animation)
    if (S.phase === "move" && S.player === WHITE && !S.animating) {
      const nm = nextMoves();
      if (S.selected === null) {
        const srcs = new Set(nm.map((m) => m.from));
        srcs.forEach((s) => markSource(s));
      } else {
        markSelected(S.selected);
        nm.filter((m) => m.from === S.selected).forEach((m) => markDest(m.to));
      }
    }
    // teach: ghost the best play's destinations pre-move
    if (S.teach && S.phase === "move" && S.player === WHITE && S.analysis && S.movesSoFar.length === 0) {
      for (const m of S.analysis.best.play.moves) {
        if (m.to >= 1 && m.to <= 24) {
          const el = document.querySelector(`.point[data-point="${m.to}"]`);
          if (el) el.classList.add("bestghost");
        }
      }
    }

    renderDice();
    renderCube();
    renderStatus();
    renderControls();
    renderTeach();
    $("teachBtn").classList.toggle("on", S.teach);
  }

  function mkBarCheckers(id) {
    const el = $(id); let c = el.querySelector(".checkers");
    if (!c) { c = document.createElement("div"); c.className = "checkers"; el.appendChild(c); }
    return c;
  }
  function markSource(s) { (s === 25 ? $("bar-bottom") : document.querySelector(`.point[data-point="${s}"]`)).classList.add("src"); }
  function markSelected(s) { (s === 25 ? $("bar-bottom") : document.querySelector(`.point[data-point="${s}"]`)).classList.add("sel"); }
  function markDest(t) { (t === 0 ? $("tray-bottom") : document.querySelector(`.point[data-point="${t}"]`)).classList.add("dst"); }

  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function dieEl(v, used, settle) {
    const d = document.createElement("div");
    d.className = "die" + (S.player === BLACK ? " brown" : "") + (used ? " used" : "") + (settle ? " settle" : "");
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("div");
      if (PIPS[v].includes(i)) { const pip = document.createElement("div"); pip.className = "pip"; cell.appendChild(pip); }
      d.appendChild(cell);
    }
    return d;
  }
  // Render an arbitrary pair of faces (used by the tumble animation).
  function renderDiceFaces(vals, settle) {
    const row = $("dice"); row.innerHTML = "";
    vals.forEach((v) => row.appendChild(dieEl(v, false, settle)));
  }
  function renderDice() {
    const row = $("dice"); row.innerHTML = "";
    if (!S.dice) return;
    const all = S.dice[0] === S.dice[1] ? [S.dice[0], S.dice[0], S.dice[0], S.dice[0]] : [S.dice[0], S.dice[1]];
    // mark used dice for the human mid-move
    const usedVals = S.player === WHITE ? S.movesSoFar.map((m) => m.die) : [];
    const usedCount = {};
    usedVals.forEach((v) => (usedCount[v] = (usedCount[v] || 0) + 1));
    const remain = {};
    all.forEach((v) => (remain[v] = (remain[v] || 0) + 1));
    all.forEach((v) => {
      const isUsed = usedCount[v] > 0;
      if (isUsed) usedCount[v]--;
      row.appendChild(dieEl(v, isUsed));
    });
  }
  function renderCube() {
    const c = $("cube"); c.textContent = S.cube;
    c.title = S.cubeOwner === null ? "cube (center)" : S.cubeOwner === WHITE ? "you own the cube" : "opponent owns the cube";
  }
  function renderStatus() {
    const w = E.winner(S.board);
    let msg;
    if (w === WHITE) msg = "You win — " + label(E.winType(S.board)) + "!";
    else if (w === BLACK) msg = "Opponent wins — " + label(E.winType(S.board)) + ".";
    else if (S.phase === "roll") msg = S.player === WHITE ? "Your turn — roll." : "Opponent to roll…";
    else if (S.phase === "move") msg = S.selected !== null ? "Tap a spot — or tap the checker again to play it." : "Your move — tap a checker.";
    else if (S.phase === "aiturn") msg = "Opponent thinking…";
    else msg = "";
    $("msg").textContent = msg;
    $("pips").textContent = `you ${E.pipCount(S.board, WHITE)} · opp ${E.pipCount(S.board, BLACK)}`;
  }
  const label = (t) => (t === "single" ? "single" : t === "gammon" ? "gammon (2×)" : "backgammon (3×)");

  function renderControls() {
    const over = !!E.winner(S.board);
    const busy = S.animating;
    const yourRoll = !over && S.phase === "roll" && S.player === WHITE;
    const yourMove = !over && S.phase === "move" && S.player === WHITE;
    const roll = $("rollBtn"), undo = $("undoBtn");
    // one button at a time: Roll before the roll, Undo once you've rolled
    roll.style.display = yourRoll ? "" : "none";
    undo.style.display = yourMove ? "" : "none";
    roll.disabled = busy || !yourRoll;
    undo.disabled = busy || !yourMove || S.movesSoFar.length === 0;
    const canDouble = !busy && yourRoll &&
      AI.LEVELS[S.level].cube && (S.cubeOwner === null || S.cubeOwner === WHITE);
    $("cube").classList.toggle("can", canDouble);
  }

  function renderTeach() {
    const panel = $("teachPanel");
    if (!S.teach || !S.lastReview || S.teachDismissed) { panel.style.display = "none"; return; }
    panel.style.display = "block";
    const r = S.lastReview;
    panel.querySelector(".verdict").className = "verdict " + r.verdict;
    panel.querySelector(".verdict").textContent = "Your move: " + Teach.VERDICT_LABEL[r.verdict];
    panel.querySelector(".why").textContent = Teach.phrase(r, S.tier);
  }
  function renderStats() {
    const el = $("homeStats"); if (!el) return;
    const pr = S.stats.lossN ? (1000 * S.stats.lossSum / S.stats.lossN).toFixed(0) : "—";
    el.textContent = `Record ${S.stats.wins}–${S.stats.losses}` +
      (S.stats.lossN ? ` · avg error ${pr} (lower is better)` : "");
  }

  // ---------- animation ----------
  const rd6 = () => 1 + Math.floor(Math.random() * 6);

  function elementFor(point, player) {
    if (point === 25) return player === WHITE ? $("bar-bottom") : $("bar-top");
    if (point === 0) return player === WHITE ? $("tray-bottom") : $("tray-top");
    return document.querySelector(`.point[data-point="${point}"]`);
  }
  // The screen rect of the exposed (top-of-stack) checker at a point.
  function topCheckerRect(point, player) {
    const host = elementFor(point, player);
    if (!host) return null;
    if (point === 0) return host.getBoundingClientRect();
    const cs = host.querySelectorAll(".checker");
    return (cs.length ? cs[cs.length - 1] : host).getBoundingClientRect();
  }

  // Fly a clone checker from one rect to another, then call done().
  function flyChecker(from, to, player, done) {
    if (!from || !to) { done && done(); return; }
    const size = Math.min(from.width || 24, 30);
    const f = document.createElement("div");
    f.className = "checker " + (player === WHITE ? "w" : "b") + " flying";
    f.style.width = size + "px"; f.style.height = size + "px";
    f.style.left = from.left + (from.width - size) / 2 + "px";
    f.style.top = from.top + (from.height ? 0 : 0) + "px";
    document.body.appendChild(f);
    f.getBoundingClientRect(); // reflow so the transition runs
    const dx = (to.left + (to.width - size) / 2) - (from.left + (from.width - size) / 2);
    const dy = to.top - from.top;
    f.style.transform = `translate(${dx}px, ${dy}px)`;
    let done_ = false;
    const finish = () => { if (done_) return; done_ = true; f.remove(); done && done(); };
    f.addEventListener("transitionend", finish, { once: true });
    setTimeout(finish, 340); // fallback if transitionend is missed
  }

  // Apply one move to the real board, render, and animate the slide.
  function commitAndAnimate(move, player, done) {
    const srcRect = topCheckerRect(move.from, player);
    const willHit = move.to >= 1 && move.to <= 24 && E.count(S.board, move.to, -player) === 1;
    const hitRect = willHit ? topCheckerRect(move.to, -player) : null;

    S.board = E.applyMove(S.board, move, player);
    render();

    let arrived = null, dstRect;
    if (move.to === 0) {
      dstRect = elementFor(0, player).getBoundingClientRect();
    } else {
      const cs = document.querySelectorAll(`.point[data-point="${move.to}"] .checker`);
      arrived = cs[cs.length - 1] || null;
      dstRect = arrived ? arrived.getBoundingClientRect() : topCheckerRect(move.to, player);
      if (arrived) arrived.style.visibility = "hidden"; // hide until the fly lands
    }

    if (hitRect) {
      const barRect = elementFor(25, -player).getBoundingClientRect();
      flyChecker(hitRect, barRect, -player, null);
      sfx.hit(); vibrate(18);
    } else { sfx.move(); vibrate(8); }

    flyChecker(srcRect, dstRect, player, () => {
      if (arrived) {
        arrived.style.visibility = "visible";
        arrived.classList.add("land");
        setTimeout(() => arrived && arrived.classList.remove("land"), 200);
      }
      done && done();
    });
  }

  // Animate a full play (sequence of moves) one step at a time.
  function animatePlay(moves, player, done) {
    let i = 0;
    (function next() {
      if (i >= moves.length) { done(); return; }
      commitAndAnimate(moves[i++], player, () => setTimeout(next, 80));
    })();
  }

  // Tumble the dice for ~0.4s, then settle on the real values, then done().
  function rollDiceAnimated(done) {
    S.dice = [rd6(), rd6()];
    sfx.dice(); vibrate(15);
    const row = $("dice"); row.classList.add("rolling");
    let ticks = 0;
    const iv = setInterval(() => {
      renderDiceFaces([rd6(), rd6()], false);
      if (++ticks >= 7) {
        clearInterval(iv);
        row.classList.remove("rolling");
        renderDiceFaces([S.dice[0], S.dice[1]], true); // settle pop on real faces
        done();
      }
    }, 55);
  }

  // ---------- consistent-play tracking ----------
  function consistent() {
    return S.plays.filter((p) => p.moves.length >= S.movesSoFar.length &&
      S.movesSoFar.every((m, i) => p.moves[i].from === m.from && p.moves[i].to === m.to));
  }
  function nextMoves() {
    const idx = S.movesSoFar.length, seen = new Set(), res = [];
    for (const p of consistent()) if (p.moves.length > idx) {
      const m = p.moves[idx], k = m.from + ">" + m.to;
      if (!seen.has(k)) { seen.add(k); res.push(m); }
    }
    return res;
  }
  const turnComplete = () => S.plays.length > 0 && S.movesSoFar.length === S.plays[0].moves.length;

  // ---------- human interaction ----------
  function onPointTap(p) {
    if (S.phase !== "move" || S.player !== WHITE || S.animating) return;
    const nm = nextMoves();
    if (S.selected === null) {
      if (nm.some((m) => m.from === p)) { S.selected = p; render(); }
      return;
    }
    // tap the already-selected checker again -> just send it where it'd go
    if (p === S.selected) { autoMoveFrom(p, nm); return; }
    // a source is already selected
    const move = nm.find((m) => m.from === S.selected && m.to === p);
    if (move) { applyHuman(move); return; }
    if (nm.some((m) => m.from === p)) { S.selected = p; render(); return; } // reselect
    S.selected = null; render();
  }

  // Tapping a selected checker a second time plays its move automatically:
  // the teaching-recommended destination if known, else the move that travels
  // farthest (uses the larger die). If there's only one option, it just goes.
  function autoMoveFrom(p, nm) {
    const opts = nm.filter((m) => m.from === p);
    if (!opts.length) { S.selected = null; render(); return; }
    let pick = null;
    if (S.analysis && S.analysis.best && S.analysis.best.play) {
      const rec = S.analysis.best.play.moves.find((m) => m.from === p);
      if (rec) pick = opts.find((m) => m.to === rec.to);
    }
    if (!pick) {
      const dist = (m) => (m.to === 0 ? 99 : p - m.to); // bear-off travels farthest
      pick = opts.reduce((a, b) => (dist(b) > dist(a) ? b : a));
    }
    applyHuman(pick);
  }

  function applyHuman(move) {
    if (S.animating) return;
    S.movesSoFar.push(move);
    S.selected = null;
    S.animating = true;
    commitAndAnimate(move, WHITE, () => {
      S.animating = false;
      if (turnComplete()) finishHumanTurn();
      else render();
    });
  }

  function finishHumanTurn() {
    // snap to the canonical resulting board of the matching play
    const match = S.plays.find((p) => Teach.samePlay(p, { moves: S.movesSoFar }));
    if (match) S.board = match.result;
    if (S.teach && S.analysis) {
      S.lastReview = Teach.review(S.analysis, { moves: S.movesSoFar, result: S.board }, S.turnStart, WHITE);
      S.teachDismissed = false;
      S.stats.lossSum += S.lastReview.loss; S.stats.lossN++;
    }
    S.plays = []; S.movesSoFar = []; S.analysis = null;
    if (checkGameOver()) return;
    S.player = BLACK; S.phase = "aiturn"; save(); render();
    setTimeout(aiTurn, 650);
  }

  function rollDice() {
    if (S.phase !== "roll" || S.player !== WHITE || S.animating) return;
    S.animating = true;
    renderControls(); // disable buttons during the roll
    rollDiceAnimated(() => {
      S.animating = false;
      S.plays = E.legalPlays(S.board, S.dice[0], S.dice[1], WHITE);
      S.movesSoFar = []; S.selected = null; S.turnStart = S.board; S.lastReview = null;
      S.analysis = S.teach ? Teach.analyze(S.board, S.dice[0], S.dice[1], WHITE) : null;
      if (S.plays.length === 1 && S.plays[0].moves.length === 0) {
        // no legal move — forfeit
        S.phase = "aiturn"; S.player = BLACK; render();
        $("msg").textContent = "No legal move — you forfeit the turn.";
        setTimeout(() => { S.dice = null; aiTurn(); }, 1100);
        return;
      }
      S.phase = "move"; render();
    });
  }

  function undo() {
    if (S.phase !== "move") return;
    S.board = S.turnStart; S.movesSoFar = []; S.selected = null; render();
  }

  // ---------- AI ----------
  function aiTurn() {
    if (E.winner(S.board)) return;
    // cube: AI may double before rolling
    if (AI.LEVELS[S.level].cube && (S.cubeOwner === null || S.cubeOwner === BLACK) &&
        AI.shouldDouble(S.board, BLACK, S.level)) {
      offerDoubleToHuman();
      return;
    }
    S.animating = true;
    renderStatus();
    rollDiceAnimated(() => {
      // choose runs synchronously (tens of ms); let the dice settle first
      setTimeout(() => {
        const play = AI.choosePlay(S.board, S.dice[0], S.dice[1], BLACK, S.level);
        if (!play || !play.moves.length) {
          S.animating = false;
          if (checkGameOver()) return;
          S.player = WHITE; S.phase = "roll"; S.dice = null; save(); render();
          return;
        }
        animatePlay(play.moves, BLACK, () => {
          S.animating = false;
          if (checkGameOver()) return;
          S.player = WHITE; S.phase = "roll"; S.dice = null; save(); render();
        });
      }, 180);
    });
  }

  // ---------- cube ----------
  function humanDouble() {
    const over = !!E.winner(S.board);
    const canDouble = !S.animating && S.phase === "roll" && S.player === WHITE && !over &&
      AI.LEVELS[S.level].cube && (S.cubeOwner === null || S.cubeOwner === WHITE);
    if (!canDouble) return;
    const proposed = S.cube * 2;
    if (AI.shouldTake(S.board, BLACK, S.level)) {
      S.cube = proposed; S.cubeOwner = BLACK; // opponent took, now owns cube
      flash(`Opponent takes. Cube at ${S.cube}.`);
      render();
    } else {
      flash("Opponent passes — you win this game.");
      endGame(WHITE, /*conceded*/ true);
    }
  }
  function offerDoubleToHuman() {
    showModal(`Opponent doubles to ${S.cube * 2}.`, [
      { text: "Take", cls: "primary", on: () => { S.cube *= 2; S.cubeOwner = WHITE; closeModal(); aiAfterCube(); } },
      { text: "Pass", on: () => { closeModal(); endGame(BLACK, true); } },
    ]);
  }
  function aiAfterCube() {
    S.animating = true;
    rollDiceAnimated(() => {
      setTimeout(() => {
        const play = AI.choosePlay(S.board, S.dice[0], S.dice[1], BLACK, S.level);
        const finishUp = () => {
          S.animating = false;
          if (checkGameOver()) return;
          S.player = WHITE; S.phase = "roll"; S.dice = null; save(); render();
        };
        if (play && play.moves.length) animatePlay(play.moves, BLACK, finishUp);
        else finishUp();
      }, 180);
    });
  }

  // ---------- game over ----------
  function checkGameOver() {
    const w = E.winner(S.board);
    if (!w) return false;
    endGame(w, false);
    return true;
  }
  function endGame(winnerSide, conceded) {
    const mult = conceded ? 1 : { single: 1, gammon: 2, backgammon: 3 }[E.winType(S.board) || "single"];
    const pts = S.cube * mult;
    if (winnerSide === WHITE) S.stats.wins++; else S.stats.losses++;
    S.phase = "over"; S.dice = null; S.animating = false; save(); render();
    if (winnerSide === WHITE) sfx.win(); else sfx.lose();
    const head = winnerSide === WHITE ? "You win! 🎉" : "Opponent wins";
    const detail = conceded ? `Cube conceded · ${pts} point${pts > 1 ? "s" : ""}.`
      : `${label(E.winType(S.board))} × cube ${S.cube} = ${pts} point${pts > 1 ? "s" : ""}.`;
    showModal(head, [
      { text: "Play again", cls: "primary", on: () => { closeModal(); newGame(); } },
      { text: "Menu", on: () => { closeModal(); showScreen("home"); } },
    ], detail);
  }

  // ---------- modal ----------
  function showModal(title, buttons, detail) {
    closeModal();
    const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<h2>${title}</h2>${detail ? `<p>${detail}</p>` : ""}<div class="row"></div>`;
    buttons.forEach((b) => {
      const btn = document.createElement("button"); btn.textContent = b.text;
      if (b.cls === "primary") btn.style.background = "#1c7c4a", btn.style.color = "#fff";
      else btn.style.background = "#2a3a47", btn.style.color = "#e8edf2";
      btn.onclick = b.on; card.querySelector(".row").appendChild(btn);
    });
    m.appendChild(card); document.body.appendChild(m);
  }
  const closeModal = () => { const m = $("modal"); if (m) m.remove(); };
  function flash(text) { $("msg").textContent = text; }

  // ---------- lifecycle ----------
  function newGame() {
    S.board = E.startingBoard(); S.player = WHITE; S.phase = "roll";
    S.dice = null; S.plays = []; S.movesSoFar = []; S.selected = null;
    S.cube = 1; S.cubeOwner = null; S.lastReview = null; S.analysis = null;
    save(); render();
  }

  // ---------- screens & menu ----------
  const STARTKEY = E.keyB(E.startingBoard());
  function gameInProgress() { return E.winner(S.board) === null && E.keyB(S.board) !== STARTKEY; }

  function showScreen(name) {
    $("home").classList.toggle("active", name === "home");
    $("game").classList.toggle("active", name === "game");
    if (name === "home") syncHome();
    else render();
  }

  function syncHome() {
    document.querySelectorAll("#homeLevel button").forEach((b) =>
      b.classList.toggle("on", b.dataset.level === S.level));
    $("homeTeach").checked = S.teach;
    $("homeTier").value = S.tier;
    $("homeSound").checked = S.sound;
    $("tierRow").style.display = S.teach ? "flex" : "none";
    $("resumeBtn").style.display = gameInProgress() ? "block" : "none";
    renderStats();
  }

  function setTeach(on) {
    S.teach = on; S.lastReview = null;
    if (on && S.phase === "move" && S.dice) S.analysis = Teach.analyze(S.turnStart, S.dice[0], S.dice[1], WHITE);
    if (!on) S.analysis = null;
    save();
    if ($("game").classList.contains("active")) render();
  }

  function openGameMenu() {
    showModal("Menu", [
      { text: "Continue", cls: "primary", on: () => closeModal() },
      { text: "New game", on: () => { closeModal(); newGame(); } },
      { text: "End game", on: () => { closeModal(); newGame(); showScreen("home"); } },
    ]);
  }

  function wire() {
    // in-game controls
    $("rollBtn").onclick = rollDice;
    $("undoBtn").onclick = undo;
    $("cube").onclick = humanDouble;
    $("homeBtn").onclick = openGameMenu;
    $("teachBtn").onclick = () => { setTeach(!S.teach); };
    $("teachClose").onclick = () => { S.teachDismissed = true; $("teachPanel").style.display = "none"; };

    // home-screen controls
    document.querySelectorAll("#homeLevel button").forEach((b) => {
      b.onclick = () => { S.level = b.dataset.level; save(); syncHome(); };
    });
    $("homeTeach").onchange = (e) => { setTeach(e.target.checked); syncHome(); };
    $("homeTier").onchange = (e) => { S.tier = e.target.value; save(); };
    $("homeSound").onchange = (e) => { S.sound = e.target.checked; if (S.sound) sfx.move(); save(); };
    $("playBtn").onclick = () => { newGame(); showScreen("game"); };
    $("resumeBtn").onclick = () => { showScreen("game"); };
  }

  document.addEventListener("DOMContentLoaded", () => {
    buildBoard(); wire();
    load();
    showScreen("home");
  });
})();


</script>
</body>
</html>
